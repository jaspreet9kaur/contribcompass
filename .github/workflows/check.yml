name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-03
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5, resolved 2026-11-03
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -m contribcompass . --strict
